# ── Perfil DEV ────────────────────────────────────────────────────────────────
# Tarefa 6: nível DEBUG em dev para facilitar diagnóstico

# Log geral da aplicação em DEBUG
logging.level.com.experiencefieldops=DEBUG

# Hibernate SQL visível
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Spring Security em DEBUG (útil para rastrear filtros e tokens)
logging.level.org.springframework.security=DEBUG

# Formato legível para dev (texto simples, não JSON)
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%-40.40logger{39}){cyan} : %msg%n
