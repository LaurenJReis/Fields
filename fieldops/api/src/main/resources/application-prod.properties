# ── Perfil PROD — AWS ─────────────────────────────────────────────────────────
# Todas as variáveis sensíveis vêm de variáveis de ambiente (nunca hardcoded).
# Configure-as no Elastic Beanstalk > Configuration > Software > Environment properties.

# ── Datasource RDS PostgreSQL ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update: cria/atualiza tabelas automaticamente sem apagar dados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── H2 Console desabilitado em produção ──────────────────────────────────────
spring.h2.console.enabled=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── AWS S3 ────────────────────────────────────────────────────────────────────
aws.s3.bucket=${S3_BUCKET}
aws.s3.region=${AWS_REGION:us-east-1}

# ── Storage ───────────────────────────────────────────────────────────────────
storage.local.path=/tmp/uploads

# ── Upload ────────────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── Log ───────────────────────────────────────────────────────────────────────
logging.level.com.experiencefieldops=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# ── Swagger ───────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
